
{% extends "base.html" %}

{% block content %}
<div class="eyebrow">PLAY &amp; LEARN</div>

<h1>PEP Space Race</h1>

<p class="intro">
  Race through a space station, answer PEP questions,
  unlock doors, and reach the finish line!
</p>

<section class="space-race-container">
  <iframe
    id="space-race-frame"
    src="{{ url_for('static', filename='games/pep-space-race/index.html') }}"
    title="PEP Space Race"
    allow="fullscreen"
    allowfullscreen>
  </iframe>
</section>

<p class="game-instructions">
  Use WASD to move, your mouse to look around, and E to
  answer questions at each door.
</p>
{% endblock %}
