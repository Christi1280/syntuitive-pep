<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f9fe">
  <title>{{ title }} | SYNTUITIVE PEP</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('main.index') }}">
      <span class="logo" aria-hidden="true">✦</span>
      <span>SYNTUITIVE<small>PEP PRACTICE</small></span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a class="{{ 'active' if active_page == 'Home' else '' }}" href="{{ url_for('main.index') }}">Home</a>
      <a class="{{ 'active' if active_page == 'Flashcards' else '' }}" href="{{ url_for('practice.flashcards') }}">Flashcards</a>
      <a class="{{ 'active' if active_page == 'Practice Tests' else '' }}" href="{{ url_for('practice.practice') }}">Practice Tests</a>
      <a class="{{ 'active' if active_page == 'Game' else '' }}" href="{{ url_for('practice.game') }}">Game</a>
    </nav>
    <form class="grade-form" action="{{ url_for('main.set_grade') }}" method="post">
      <input type="hidden" name="grade_csrf_token" value="{{ grade_csrf_token }}">
      <input type="hidden" name="return_to" value="{{ request.full_path if request.query_string else request.path }}">
      <label for="header-grade">Grade</label>
      <select id="header-grade" name="grade" aria-label="Select grade" onchange="this.form.submit()">
        {% for grade in supported_grades %}
          <option value="{{ grade }}" {{ 'selected' if current_grade == grade else '' }}>Grade {{ grade }}</option>
        {% endfor %}
      </select>
    </form>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">SYNTUITIVE PEP · Sample learning activities</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
